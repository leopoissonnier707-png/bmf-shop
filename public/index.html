<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Underground RP - Black Market</title>
  <style>
    :root {
      --bg: #0d0f12;
      --bg2: #161a22;
      --teal: #00d4c8;
      --teal-glow: rgba(0,212,200,0.3);
      --text: #e6edf3;
      --muted: #8b949e;
      --danger: #f85149;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--teal); padding-bottom: 15px; margin-bottom: 20px; }
    .btn { background: var(--teal); color: #000; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-danger { background: var(--danger); color: #fff; }
    .card { background: var(--bg2); border: 1px solid rgba(0,212,200,0.2); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    input, select { width: 100%; padding: 10px; margin-top: 8px; background: var(--bg); border: 1px solid rgba(0,212,200,0.3); color: var(--text); border-radius: 6px; box-sizing: border-box; }
    
    /* MODAL */
    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 999; }
    .modal-content { background: var(--bg2); border: 2px solid var(--teal); padding: 25px; border-radius: 10px; width: 500px; max-width: 90%; max-height: 85vh; overflow-y: auto; }
    .role-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .gear-icon { cursor: pointer; font-size: 18px; transition: transform 0.2s; }
    .gear-icon:hover { transform: rotate(90deg); }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🔫 UNDERGROUND BLACK MARKET</h1>
    <div id="auth-zone">
      <a href="/auth/discord" class="btn">Connexion Discord</a>
    </div>
  </div>

  <!-- PANEL ADMIN SI PERMISSION -->
  <div id="admin-panel" style="display:none;">
    <h2>⚙️ Panneau de Gestion Staff</h2>

    <!-- RECHERCHE LOGS PAR ID -->
    <div class="card" id="sec-logs" style="display:none;">
      <h3>🔍 Recherche Logs par ID Discord</h3>
      <div style="display:flex;gap:10px;">
        <input type="text" id="search-id" placeholder="Ex: 289410928301928301">
        <button class="btn" onclick="searchLogs()">Rechercher</button>
      </div>
      <div id="logs-result" style="margin-top:15px;"></div>
    </div>

    <!-- SUPPRESSION ARTICLE PAR NOM EXACT -->
    <div class="card" id="sec-del-weapon" style="display:none;">
      <h3>🗑️ Supprimer un article du catalogue</h3>
      <input type="text" id="del-weapon-name" placeholder="Tapez le nom EXACT de l'article...">
      <button class="btn btn-danger" style="margin-top:10px;" onclick="deleteWeaponByName()">Confirmer la suppression</button>
    </div>

    <!-- CONFIGURATION DES RÔLES DISCORD -->
    <div class="card" id="sec-roles" style="display:none;">
      <h3>🎭 Roles Discord & Permissions</h3>
      <div id="roles-list">Chargement des rôles...</div>
    </div>
  </div>
</div>

<!-- MODAL REGLAGE ROLE -->
<div id="role-modal" class="modal-overlay" style="display:none;">
  <div class="modal-content">
    <h3 id="modal-role-name">Configuration du rôle</h3>
    
    <div style="display:flex;gap:10px;margin-bottom:15px;">
      <button class="btn" onclick="toggleModalTab('perms')">🔑 Permissions</button>
      <button class="btn" onclick="toggleModalTab('members')">👥 Membres (<span id="modal-member-count">0</span>)</button>
    </div>

    <!-- ONGLET PERMISSIONS -->
    <div id="tab-perms">
      <label><input type="checkbox" id="p-admin"> Accès Admin Global</label><br><br>
      <label><input type="checkbox" id="p-weapons"> Ajouter des articles</label><br><br>
      <label><input type="checkbox" id="p-del-weapons"> Supprimer des articles</label><br><br>
      <label><input type="checkbox" id="p-orders"> Traiter les commandes</label><br><br>
      <label><input type="checkbox" id="p-promos"> Gérer les promos</label><br><br>
      <label><input type="checkbox" id="p-roles"> Configurer les rôles</label><br><br>
      <label><input type="checkbox" id="p-logs"> Rechercher dans les logs</label><br><br>
      <button class="btn" onclick="saveRolePermissions()">Enregistrer</button>
    </div>

    <!-- ONGLET MEMBRES -->
    <div id="tab-members" style="display:none;">
      <div id="members-list-content"></div>
    </div>

    <br>
    <button class="btn btn-danger" onclick="closeRoleModal()">Fermer</button>
  </div>
</div>

<script>
  let currentRoleId = null;
  let rolesData = [];

  // Chargement Profil Utilisateur
  async function init() {
    const res = await fetch('/api/me');
    const data = await res.json();

    if (data.user) {
      document.getElementById('auth-zone').innerHTML = `
        <span>Bienvenue, <b>${data.user.username}</b></span>
        <a href="/auth/logout" class="btn btn-danger" style="margin-left:10px;">Déconnexion</a>
      `;

      if (data.perms && (data.perms.isAdmin || Object.values(data.perms).some(v => v === true))) {
        document.getElementById('admin-panel').style.display = 'block';
        if (data.perms.canViewLogs || data.perms.isAdmin) document.getElementById('sec-logs').style.display = 'block';
        if (data.perms.canDeleteWeapons || data.perms.isAdmin) document.getElementById('sec-del-weapon').style.display = 'block';
        if (data.perms.canManageRoles || data.perms.isAdmin) {
          document.getElementById('sec-roles').style.display = 'block';
          loadRoles();
        }
      }
    }
  }

  // Charger les rôles depuis Discord
  async function loadRoles() {
    const res = await fetch('/api/roles');
    rolesData = await res.json();
    
    let html = '';
    rolesData.forEach(r => {
      html += `
        <div class="role-item">
          <div>
            <span style="color:${r.color};font-weight:bold;">● ${r.name}</span>
            <span style="color:var(--muted);font-size:12px;margin-left:8px;">(${r.memberCount} membres)</span>
          </div>
          <span class="gear-icon" onclick="openRoleModal('${r.id}')">⚙️</span>
        </div>
      `;
    });
    document.getElementById('roles-list').innerHTML = html;
  }

  function openRoleModal(roleId) {
    currentRoleId = roleId;
    const role = rolesData.find(r => r.id === roleId);
    if (!role) return;

    document.getElementById('modal-role-name').innerText = `⚙️ Configuration : ${role.name}`;
    document.getElementById('modal-member-count').innerText = role.memberCount;

    // Remplir checkboxes
    const p = role.permissions || {};
    document.getElementById('p-admin').checked = !!p.isAdmin;
    document.getElementById('p-weapons').checked = !!p.canManageWeapons;
    document.getElementById('p-del-weapons').checked = !!p.canDeleteWeapons;
    document.getElementById('p-orders').checked = !!p.canManageOrders;
    document.getElementById('p-promos').checked = !!p.canManagePromos;
    document.getElementById('p-roles').checked = !!p.canManageRoles;
    document.getElementById('p-logs').checked = !!p.canViewLogs;

    // Remplir Membres
    let mHtml = '';
    role.members.forEach(m => {
      mHtml += `<div style="padding:6px 0;border-bottom:1px solid #333;"><b>${m.username}</b> (ID: <code>${m.id}</code>)</div>`;
    });
    document.getElementById('members-list-content').innerHTML = mHtml || 'Aucun membre.';

    document.getElementById('role-modal').style.display = 'flex';
  }

  function closeRoleModal() { document.getElementById('role-modal').style.display = 'none'; }

  function toggleModalTab(tab) {
    document.getElementById('tab-perms').style.display = tab === 'perms' ? 'block' : 'none';
    document.getElementById('tab-members').style.display = tab === 'members' ? 'block' : 'none';
  }

  async function saveRolePermissions() {
    const payload = {
      isAdmin: document.getElementById('p-admin').checked,
      canManageWeapons: document.getElementById('p-weapons').checked,
      canDeleteWeapons: document.getElementById('p-del-weapons').checked,
      canManageOrders: document.getElementById('p-orders').checked,
      canManagePromos: document.getElementById('p-promos').checked,
      canManageRoles: document.getElementById('p-roles').checked,
      canViewLogs: document.getElementById('p-logs').checked
    };

    await fetch(`/api/roles/${currentRoleId}/permissions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    alert('Permissions sauvegardées !');
    closeRoleModal();
    loadRoles();
  }

  async function deleteWeaponByName() {
    const name = document.getElementById('del-weapon-name').value;
    if (!name) return alert('Veuillez entrer le nom exact');

    if (!confirm(`Êtes-vous sûr de vouloir supprimer définitivement l'article "${name}" ?`)) return;

    const res = await fetch('/api/weapons/by-name', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ exactName: name })
    });

    const data = await res.json();
    if (res.ok) {
      alert('Article supprimé avec succès !');
      document.getElementById('del-weapon-name').value = '';
    } else {
      alert('Erreur: ' + data.error);
    }
  }

  async function searchLogs() {
    const id = document.getElementById('search-id').value;
    if (!id) return;

    const res = await fetch(`/api/logs/user/${id}`);
    const data = await res.json();

    let html = `<h4>Commandes effectuées (${data.ordersPlaced.length})</h4>`;
    data.ordersPlaced.forEach(o => {
      html += `<p>• Commande #${o.id} - Total: ${o.total}€ - Statut: ${o.status}</p>`;
    });

    html += `<h4>Commandes validées en tant que Staff (${data.ordersProcessed.length})</h4>`;
    data.ordersProcessed.forEach(o => {
      html += `<p>• Validation de la commande #${o.id} pour ${o.pseudo}</p>`;
    });

    document.getElementById('logs-result').innerHTML = html;
  }

  init();
</script>
</body>
</html>
